
workflows:
  survey-helper-pro-ios:
    name: Survey Helper Pro iOS unsigned build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      xcode: latest
      node: 22
    scripts:
      - name: Install dependencies
        script: |
          npm install --no-audit --no-fund
      - name: Build web assets
        script: |
          npm run build
      - name: Run tests
        script: |
          npm test
      - name: Add iOS project if missing
        script: |
          if [ ! -d ios/App ]; then
            npx cap add ios
          fi
      - name: Sync iOS project
        script: |
          npx cap sync ios
      - name: Build unsigned iOS app
        script: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - build/**/*.app
      - ios/App/build/**/*.app
